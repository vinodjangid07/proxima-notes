<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html { background-color: #faf9f6; color: #141416; }
      html.dark { background-color: #09090b; color: #f4f4f2; }
      html.preload, html.preload * { transition: none !important; }
    </style>
    <script>
      (function () {
        try {
          var de = document.documentElement;
          de.classList.add('js', 'preload');
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            de.classList.add('motion');
          }
          var t = localStorage.getItem('theme');
          if (t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            de.classList.remove('dark');
          } else {
            de.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>Proxima | Local-First Workspace</title>
    <meta name="title" content="Proxima | Local-First Workspace" />
    <meta name="description" content="A quiet, local-first workspace for your thoughts and ideas. Works 100% offline, stores in open Markdown, and syncs across devices with zero tracking." />
    <meta name="keywords" content="Proxima, notes app, local-first notes, markdown notes, offline notes, private notes, pwa notes, fast notes, distraction-free workspace" />
    <meta name="author" content="Vinod Jangid" />
    <meta name="creator" content="Vinod Jangid" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://proxima.vinodjangid.site/" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Preload critical display and body font subsets -->

    <!-- Theme Color -->
