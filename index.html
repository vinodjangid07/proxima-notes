<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Proxima | Local-First Workspace</title>
    <meta name="title" content="Proxima | Local-First Workspace" />
    <meta name="description" content="A quiet, local-first workspace for your thoughts and ideas. Works 100% offline, stores in open Markdown, and syncs across devices with zero tracking." />
    <meta name="keywords" content="Proxima, notes app, local-first notes, markdown notes, offline notes, private notes, pwa notes, fast notes, distraction-free workspace" />
    <meta name="author" content="Vinod Jangid" />
    <meta name="creator" content="Vinod Jangid" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://proxima.vinodjangid.site/" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/proxima_logo.webp" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Proxima" />
    <meta property="og:url" content="https://proxima.vinodjangid.site/" />
    <meta property="og:title" content="Proxima | Local-First Workspace" />
    <meta property="og:description" content="Write at the speed of thought. Never lose an idea. A quiet, local-first workspace that works 100% offline, stores in open Markdown, and syncs seamlessly." />
    <meta property="og:image" content="https://proxima.vinodjangid.site/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://proxima.vinodjangid.site/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="607" />
    <meta property="og:image:alt" content="Proxima | Local-First Workspace Preview" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://proxima.vinodjangid.site/" />
    <meta name="twitter:title" content="Proxima — Local-First Workspace" />
    <meta name="twitter:description" content="Write at the speed of thought. Never lose an idea. A quiet, local-first workspace that works 100% offline, stores in open Markdown, and syncs seamlessly." />
    <meta name="twitter:image" content="https://proxima.vinodjangid.site/og-image.jpg" />
    <meta name="twitter:image:alt" content="Proxima — Local-First Workspace Preview" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Proxima",
        "url": "https://proxima.vinodjangid.site/",
        "description": "A quiet, local-first workspace for your thoughts and ideas. Works 100% offline, stores in open Markdown, and syncs across devices.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "image": "https://proxima.vinodjangid.site/og-image.jpg",
        "screenshot": "https://proxima.vinodjangid.site/og-image.jpg",
        "author": {
          "@type": "Person",
          "name": "Vinod Jangid",
          "url": "https://vinodjangid.site"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      try {
        let theme = localStorage.getItem('theme');
        if (theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches) || !theme) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
